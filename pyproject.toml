[project]
name = "grinning-cat-plus"
description = "Introduce new LLMs, Embedders, Chunkers, File Managers, Parsers. It includes multimodal capabilities to the Grinning Cat framework, enabling the processing of images."
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "audioop-lts>=0.2.2,<1 ; python_version >= '3.13'",
    "azure-storage-blob>=12.30.0,<13",
    "boto3>=1.43.75,<2",
    "fastembed>=0.8.0,<1",
    "faster-whisper>=1.2.1,<2",
    "google-cloud-storage>=3.13.1,<4",
    "langchain-anthropic>=1.6.0,<2",
    "langchain-cohere>=0.6.0,<1",
    "langchain-google-genai>=4.3.4,<5",
    "langchain-groq>=1.1.3,<2",
    "langchain-mistralai>=1.1.6,<2",
    "langchain-ollama>=1.1.0,<2",
    "langchain-openai>=1.6.0,<2",
    "langchain-unstructured>=1.0.1,<2",
    "langchain-voyageai>=0.4.1,<1",
    "nltk>=3.10.3,<4",
    "odfpy>=1.4.1,<2",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.0.1,<4",
    "pdfminer-six>=20260107",
    "pydub>=0.25.1,<1",
    "python-pptx>=1.0.2,<2",
    "pytube>=15.0.0,<16",
    "sentence-transformers>=4.1.0,<6",
    "spacy>=3.8.15,<4",
    "text-generation>=0.7.0,<1",
    "unstructured[all-docs]>=0.18.1,<1",
    "xlrd>=2.0.2,<3",
    "youtube-transcript-api>=1.2.4,<2",
]
